<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>流光疾走 FLUX RUSH 5.0 · 3D双风格节奏跑酷</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" media="print" onload="this.media='all'">
<style>
:root,body[data-theme="cyber"]{--c1:#00e5ff;--c2:#ff2d95;--bg:#05010e;--panel:rgba(10,6,28,.86);--pb:rgba(0,229,255,.4);--text:#e9f9ff;--dim:#8fa8c8;--vig:inset 0 0 180px rgba(0,0,0,.75);--radius:2px}
body[data-theme="dream"]{--c1:#ff8fc7;--c2:#6fc8ff;--bg:#bfe7ff;--panel:rgba(255,255,255,.78);--pb:rgba(255,143,199,.6);--text:#5b4a86;--dim:#8f86b5;--vig:inset 0 0 180px rgba(255,150,205,.28);--radius:22px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:'Orbitron','PingFang SC','Microsoft YaHei',sans-serif;color:var(--text);touch-action:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#vig{position:fixed;inset:0;pointer-events:none;z-index:2;box-shadow:var(--vig)}
#scan{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.4;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.2) 2px 4px)}
body[data-theme="dream"] #scan{display:none}
#dglow{position:fixed;inset:0;pointer-events:none;z-index:3;display:none;background:radial-gradient(40% 35% at 20% 20%,rgba(255,179,222,.35),transparent 70%),radial-gradient(45% 40% at 80% 30%,rgba(160,205,255,.35),transparent 70%),radial-gradient(50% 45% at 50% 85%,rgba(200,170,255,.3),transparent 70%)}
body[data-theme="dream"] #dglow{display:block}
#flash{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0;background:#fff}
#boot{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:var(--bg);transition:opacity .6s}
#boot.hide{opacity:0;pointer-events:none}
.boot-inner{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px}
.boot-spin{width:46px;height:46px;border:3px solid var(--pb);border-top-color:var(--c1);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.boot-msg{font-size:14px;letter-spacing:.25em}.boot-sub{font-size:11px;color:var(--dim);line-height:1.8}
.layer{position:fixed;inset:0;z-index:10;display:none}
.layer.show{display:flex}
.panel{background:var(--panel);border:1px solid var(--pb);border-radius:var(--radius);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.btn{font-family:inherit;cursor:pointer;background:transparent;color:var(--c1);border:1px solid var(--c1);border-radius:var(--radius);padding:12px 30px;font-size:15px;letter-spacing:.28em;font-weight:700;position:relative;overflow:hidden;text-shadow:0 0 10px var(--c1);transition:all .25s;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
body[data-theme="dream"] .btn{clip-path:none;border-radius:999px}
.btn:hover{background:var(--c1);color:var(--bg);text-shadow:none;box-shadow:0 0 26px var(--c1);transform:translateY(-2px)}
.btn.primary{font-size:18px;padding:16px 46px}
.btn.small{padding:8px 18px;font-size:12px;letter-spacing:.18em}
.btn.ghost{border-color:var(--dim);color:var(--dim);text-shadow:none}
.btn.ghost:hover{border-color:var(--c1);color:var(--c1)}
.chip{font-family:inherit;cursor:pointer;background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--pb);border-radius:999px;padding:6px 14px;font-size:12px;letter-spacing:.1em;transition:all .25s}
.chip:hover{border-color:var(--c1);color:var(--c1)}
.chip.on{background:var(--c1);color:var(--bg);border-color:var(--c1)}
#menu{align-items:center;justify-content:center;z-index:20}
#menu .panel{width:min(92vw,560px);padding:32px 30px 24px;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
h1{font-size:clamp(2.1rem,6vw,3.6rem);font-weight:900;letter-spacing:.14em;line-height:1;background:linear-gradient(180deg,#fff 10%,var(--c1) 55%,var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
body[data-theme="cyber"] h1{animation:glitch 4s infinite}
body[data-theme="dream"] h1{animation:floaty 4s ease-in-out infinite}
@keyframes glitch{0%,88%,100%{transform:none}90%{transform:translate(3px,-2px)}92%{transform:translate(-3px,1px)}94%{transform:translate(2px,2px)}96%{transform:translate(-1px,-1px)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.subtitle{font-size:12px;letter-spacing:.35em;color:var(--dim)}
.wallet{font-size:12px;color:var(--c2);letter-spacing:.15em;font-weight:700}
.menu-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ver{font-size:10px;color:var(--dim);opacity:.7;letter-spacing:.2em}
.sw{display:flex;border:1px solid var(--pb);border-radius:999px;overflow:hidden;width:fit-content}
.sw button{font-family:inherit;cursor:pointer;border:none;background:transparent;color:var(--dim);padding:10px 26px;font-size:14px;letter-spacing:.2em;font-weight:700;transition:all .3s}
.sw button.on{background:linear-gradient(90deg,var(--c1),var(--c2));color:#fff}
.mp{width:100%;border:1px dashed var(--pb);border-radius:var(--radius);padding:13px 16px;display:flex;flex-direction:column;gap:10px;font-size:12px;text-align:left}
.mp-title{letter-spacing:.3em;color:var(--dim)}
.mp-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--dim)}
.music-dd{font-family:inherit;width:100%;background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--pb);border-radius:var(--radius);padding:10px 12px;font-size:12px;letter-spacing:.08em;cursor:pointer;outline:none;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--c1) 50%),linear-gradient(135deg,var(--c1) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.music-dd option{background:#0a0620;color:#e9f9ff}
body[data-theme="dream"] .music-dd option{background:#fff;color:#5b4a86}
input[type=range]{accent-color:var(--c1);width:110px}
.keys{font-size:11px;color:var(--dim);letter-spacing:.12em;line-height:1.9}
.mp-note{font-size:10px;color:var(--dim);opacity:.7}
#levels{align-items:center;justify-content:center;z-index:20}
#levels .panel{width:min(94vw,880px);max-height:92vh;overflow-y:auto;padding:26px 24px;display:flex;flex-direction:column;gap:14px}
.lv-head{display:flex;justify-content:space-between;align-items:center}
.lv-head h2{font-size:18px;letter-spacing:.35em;text-shadow:0 0 12px var(--c1)}
.lv-diff{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 14px;border:1px solid var(--pb);border-radius:var(--radius)}
.lv-diff-title{font-size:12px;letter-spacing:.3em;color:var(--dim)}
.diff-desc{font-size:11px;color:var(--dim);flex-basis:100%}
.mode-chips{display:flex;gap:8px;flex-wrap:wrap}
#lv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.lv-card{position:relative;cursor:pointer;border:1px solid var(--pb);border-radius:var(--radius);padding:15px 13px;display:flex;flex-direction:column;gap:6px;overflow:hidden;transition:all .3s;background:rgba(255,255,255,.03)}
.lv-card:hover{transform:translateY(-4px);border-color:var(--c1)}
.lv-card.wide{grid-column:1/-1;min-height:130px;justify-content:center;text-align:center;align-items:center}
.lv-num{font-size:24px;font-weight:900;color:var(--c1);text-shadow:0 0 14px var(--c1)}
.lv-name{font-size:15px;font-weight:700;letter-spacing:.1em}
.lv-name span{display:block;font-size:9px;color:var(--dim);letter-spacing:.25em;margin-top:2px}
.lv-desc{font-size:11px;color:var(--dim);min-height:2.6em;line-height:1.5}
.lv-best{font-size:11px;color:var(--c2)}
.lv-card.locked{opacity:.4;cursor:not-allowed}
.lv-lock{position:absolute;right:10px;top:10px;font-size:16px}
#hud{flex-direction:column;justify-content:space-between;padding:16px 18px;pointer-events:none;z-index:10}
#hud-top{display:flex;justify-content:space-between;align-items:flex-start}
.hud-level{font-size:12px;letter-spacing:.22em;margin-bottom:8px;text-shadow:0 0 10px var(--c1)}
#progress{width:min(200px,40vw);height:5px;background:rgba(255,255,255,.14);border-radius:3px;overflow:hidden}
#progress i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,var(--c1),var(--c2));border-radius:3px}
/* v5.0: 流光超载能量条 + 疾闪按钮 */
#flux-wrap{display:flex;align-items:center;gap:7px;margin-top:7px}
#flux-bar{width:min(200px,40vw);height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;border:1px solid rgba(255,255,255,.14)}
#flux-bar i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,#7d5bff,#ff4df0,#ffe24d);border-radius:3px;transition:transform .12s linear}
#flux-wrap.on #flux-bar{box-shadow:0 0 16px #b44dff;animation:fluxpulse .5s ease infinite alternate}
@keyframes fluxpulse{from{filter:brightness(1)}to{filter:brightness(1.7)}}
#flux-lbl{font-size:9px;letter-spacing:.22em;color:var(--dim)}
#flux-wrap.on #flux-lbl{color:#ff8fe8;text-shadow:0 0 10px #ff4df0}
.dash-slot{font-size:19px!important}
.dash-slot.cool{opacity:.4;animation:none!important;box-shadow:none!important}
#hud-score{font-size:26px;font-weight:900;text-shadow:0 0 16px var(--c1)}
#hud-combo{font-size:12px;color:var(--c2);letter-spacing:.2em;height:16px;font-weight:700}
#hud-buffs{font-size:11px;color:var(--c1);letter-spacing:.08em;height:15px;text-shadow:0 0 8px var(--c1)}
#hud-pet{font-size:11px;color:var(--c1);height:14px;letter-spacing:.08em}
#hud-kills{font-size:13px;color:#ff88aa;letter-spacing:.15em;height:16px;font-weight:700;text-shadow:0 0 10px #ff2d95}
#hud-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#countdown{font-size:clamp(4rem,16vw,8.5rem);font-weight:900;color:var(--c1);text-shadow:0 0 60px var(--c1),0 0 20px var(--c2);opacity:0}
#countdown.pop{animation:cdpop .95s ease forwards}
@keyframes cdpop{0%{opacity:0;transform:scale(1.8)}15%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(.75)}}
#boost-ind{margin-top:12px;font-size:15px;letter-spacing:.5em;font-weight:900;color:var(--c1);text-shadow:0 0 18px var(--c1);opacity:0;transition:opacity .2s}
#boost-ind.on{opacity:1;animation:bfl .4s ease infinite alternate}
@keyframes bfl{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
#hud-tip{position:absolute;bottom:24vh;font-size:13px;letter-spacing:.12em;background:var(--panel);border:1px solid var(--pb);padding:10px 22px;border-radius:999px;opacity:0;transition:opacity .5s;text-align:center;max-width:88vw}
#hud-tip.show{opacity:1}
#hud-bottom{display:flex;justify-content:space-between;align-items:flex-end}
#hearts{display:flex;gap:10px;padding-left:6px;flex-wrap:wrap;max-width:50vw}
.heart{width:13px;height:13px;transform:rotate(45deg);background:var(--c2);box-shadow:0 0 14px var(--c2);border-radius:2px}
.heart.off{background:rgba(255,255,255,.15);box-shadow:none}
.heart.lost{animation:hlost .5s ease}
@keyframes hlost{0%{transform:rotate(45deg) scale(1.8)}100%{transform:rotate(45deg) scale(1)}}
#hud-speed{font-size:14px;letter-spacing:.2em;color:var(--dim)}
#hud-speed b{color:var(--c1);font-size:20px;text-shadow:0 0 10px var(--c1)}
.hud-actions{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
#item-slots{position:absolute;bottom:13vh;left:50%;transform:translateX(-50%);display:flex;gap:14px;pointer-events:auto}
.item-slot{width:50px;height:50px;border-radius:50%;border:1px solid var(--pb);background:var(--panel);color:var(--c1);font-size:22px;cursor:pointer;position:relative;transition:all .2s;padding:0}
.item-slot.has{box-shadow:0 0 18px var(--c1);border-color:var(--c1);animation:islot 1.6s ease infinite}
@keyframes islot{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.item-slot .key{position:absolute;bottom:-2px;right:-2px;font-size:9px;background:var(--c1);color:var(--bg);border-radius:50%;width:14px;height:14px;line-height:14px;text-align:center;font-weight:700}
#atk-ui{position:absolute;right:5vw;bottom:14vh;display:none;gap:14px;pointer-events:auto;z-index:11}
.atk-btn{width:64px;height:64px;border-radius:50%;border:2px solid var(--c1);background:var(--panel);color:var(--c1);font-size:24px;cursor:pointer;position:relative;overflow:hidden}
.atk-btn .cdmask{position:absolute;left:0;bottom:0;width:100%;height:0%;background:rgba(0,0,0,.55);pointer-events:none}
.atk-btn span.lbl{position:absolute;top:2px;right:4px;font-size:9px;opacity:.8}
.atk-btn:active{transform:scale(.93)}
#hud-chat{position:absolute;right:18px;bottom:26vh;width:min(280px,46vw);display:none;flex-direction:column;gap:6px;pointer-events:auto;z-index:12}
#chat-hist-hud{max-height:104px;overflow-y:auto;font-size:11px;line-height:1.6;display:flex;flex-direction:column;gap:3px}
#chat-hist-hud div{background:rgba(0,0,0,.45);border-radius:8px;padding:3px 9px;width:fit-content;max-width:100%;word-break:break-all}
#chat-hud-in{font-family:inherit;background:var(--panel);border:1px solid var(--pb);color:var(--text);border-radius:999px;padding:7px 14px;font-size:12px;outline:none}
#chat-hist-menu{width:100%;height:110px;overflow-y:auto;font-size:11px;line-height:1.7;text-align:left;background:rgba(0,0,0,.18);border:1px dashed var(--pb);border-radius:var(--radius);padding:8px;display:flex;flex-direction:column;gap:2px}
#chat-menu-in,#room-in,#srv-in{font-family:inherit;flex:1;min-width:120px;background:rgba(255,255,255,.06);border:1px solid var(--pb);color:var(--text);border-radius:999px;padding:8px 14px;font-size:12px;outline:none}
#room-in{width:150px;flex:none;font-size:14px;letter-spacing:.25em;text-align:center}
#srv-in{width:100%;border-radius:var(--radius);font-size:11px;color:var(--dim)}
#net-stat{font-size:11px;letter-spacing:.1em;color:var(--c1);min-height:14px}
#pause,#result,#settings,#about,#ach,#deco,#shop{align-items:center;justify-content:center;z-index:22;background:rgba(0,0,0,.35)}
#pause .panel,#result .panel{width:min(92vw,460px);padding:32px 28px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
#settings .panel,#about .panel,#ach .panel,#deco .panel,#shop .panel{width:min(94vw,600px);max-height:88vh;overflow-y:auto;padding:28px 24px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.p-title{font-size:22px;font-weight:900;letter-spacing:.4em;text-shadow:0 0 16px var(--c1)}
.set-row{width:100%;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;border:1px solid var(--pb);border-radius:var(--radius);padding:10px 14px}
.set-label{font-size:12px;letter-spacing:.2em;color:var(--dim)}
.skin-chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#perm-row{width:100%;display:none;flex-direction:column;gap:8px;align-items:center;border:1px dashed var(--pb);border-radius:var(--radius);padding:10px}
#perm-row.show{display:flex}
#perm-in{font-family:inherit;background:transparent;border:1px solid var(--pb);color:var(--text);padding:8px 12px;border-radius:var(--radius);letter-spacing:.3em;text-align:center;width:180px}
.about-content{font-size:12px;color:var(--dim);line-height:2;text-align:left;white-space:pre-line;width:100%}
.ach-grid,.shop-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;width:100%}
.ach-card,.shop-card{border:1px solid var(--pb);border-radius:var(--radius);padding:12px;text-align:left;display:flex;flex-direction:column;gap:5px}
.shop-card{cursor:pointer;transition:all .2s;background:rgba(255,255,255,.03)}
.shop-card:hover{border-color:var(--c1)}
.shop-card.locked{opacity:.55}
.ach-card.done{border-color:var(--c1);box-shadow:0 0 12px rgba(0,229,255,.15)}
.ach-card.locked{opacity:.45}
.ach-ico,.shop-ico{font-size:22px}
.ach-name,.shop-name{font-size:13px;font-weight:700;letter-spacing:.05em}
.ach-desc,.shop-desc{font-size:10px;color:var(--dim);line-height:1.5}
.shop-price{font-size:11px;color:var(--c2);font-weight:700}
.shop-act{font-size:10px;color:var(--c1);letter-spacing:.1em}
.shop-tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#shop-wallet{font-size:14px;color:var(--c2);letter-spacing:.12em;font-weight:700}
.r-stars{display:flex;gap:18px;margin:6px 0}
.star{width:26px;height:26px;transform:rotate(45deg);border-radius:4px;background:rgba(255,255,255,.12)}
.star.on{background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 0 24px var(--c2);animation:spop .5s ease backwards}
.star.on:nth-child(2){animation-delay:.25s}.star.on:nth-child(3){animation-delay:.5s}
@keyframes spop{0%{transform:rotate(45deg) scale(0)}70%{transform:rotate(45deg) scale(1.5)}100%{transform:rotate(45deg) scale(1)}}
.r-score{font-size:15px;color:var(--dim);letter-spacing:.15em}
.r-score b{color:var(--c1);font-size:30px;display:block;text-shadow:0 0 14px var(--c1)}
.r-best{font-size:11px;color:var(--dim)}
.r-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px}
#toast{position:fixed;top:26px;left:50%;transform:translate(-50%,-80px);z-index:60;background:var(--panel);border:1px solid var(--c1);border-radius:999px;padding:10px 26px;font-size:13px;letter-spacing:.12em;transition:transform .4s cubic-bezier(.2,1.4,.4,1)}
#toast.show{transform:translate(-50%,0)}
/* v4.2: 音乐悬浮球 */
#music-ball{position:fixed;z-index:58;display:flex;flex-direction:column;align-items:flex-end;gap:8px;transition:left .25s ease}
#mb-ico{width:44px;height:44px;border-radius:50%;background:var(--panel);border:1px solid var(--c1);color:var(--c1);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none;box-shadow:0 0 16px var(--pb);user-select:none;flex:none}
#mb-ico:active{transform:scale(.93)}
#mb-panel{display:none;width:216px;background:var(--panel);border:1px solid var(--pb);border-radius:12px;padding:10px 12px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#mb-name{font-size:11px;letter-spacing:.05em;margin-bottom:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
#mb-ctrl{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#mb-play{width:30px;height:30px;border-radius:50%;border:1px solid var(--c1);background:transparent;color:var(--c1);font-size:13px;cursor:pointer;flex:none;line-height:1}
#mb-time{font-size:10px;color:var(--dim);letter-spacing:.05em}
#mb-bar{width:100%;accent-color:var(--c1)}
body[data-mode="travel"] #hearts,body[data-mode="travel"] #item-slots,body[data-mode="travel"] #progress,body[data-mode="travel"] #hud-score,body[data-mode="travel"] #hud-speed,body[data-mode="travel"] #hud-buffs,body[data-mode="travel"] #hud-kills,body[data-mode="travel"] #boost-ind,body[data-mode="travel"] #atk-ui{visibility:hidden!important}
@media(max-width:600px){.btn{padding:11px 20px;font-size:13px}.btn.primary{padding:14px 32px;font-size:15px}#hud-score{font-size:20px}#lv-grid{grid-template-columns:repeat(2,1fr)}.lv-card.wide{grid-column:1/-1}.item-slot{width:44px;height:44px;font-size:19px}}
</style>
</head>
<body data-theme="cyber">
<canvas id="cv"></canvas>
<div id="vig"></div><div id="scan"></div><div id="dglow"></div><div id="flash"></div>
<div id="boot"><div class="boot-inner"><div class="boot-spin"></div><div class="boot-msg">正在加载 3D 引擎…</div><div class="boot-sub">首次运行需联网获取渲染库与联机库</div></div></div>
<div id="hud" class="layer">

function netTry(){
const cfgs=serverCfgs();

const label=cfg.host?('['+(NET.cfgIdx+1)+'/'+cfgs.length+'] '+cfg.host):('['+(NET.cfgIdx+1)+'/'+cfgs.length+'] cloud');

try{NET.peer=NET.host?new Peer(hostPeerId(),cfg):new Peer(cfg);}catch(e){netStat('⚠ '+e.message);return;}
NET.openTo=setTimeout(function(){
if(NET.ok||!NET.peer)return;
try{NET.peer.destroy();}catch(e){}
NET.cfgIdx++;netTry();
},15000);
NET.peer.on('open',function(){

netStat('🏠 ['+NET.room+(NET.salt?'-'+NET.salt:'')+'] '+T('dualWaitHost'));

NET.conn=NET.peer.connect(hostPeerId(),{reliable:true});

netCleanup();
},12000);
bindConn();
}
});

});

if(t==='peer-unavailable'&&!NET.host){
if(NET.connTo){clearTimeout(NET.connTo);NET.connTo=null;}

}

if(NET.openTo){clearTimeout(NET.openTo);NET.openTo=null;}

p.life-=dt;
if(p.life<=0){p.spr.visible=false;p.mat.opacity=0;continue;}
const k=p.life/p.max;
if(p.drag>0){const f=Math.exp(-p.drag*dt);p.vx*=f;p.vz*=f;}
if(p.grav!==0)p.vy-=p.grav*dt;
p.spr.position.x+=p.vx*dt;p.spr.position.y+=p.vy*dt;p.spr.position.z+=p.vz*dt;
if(p.kind==='ring'){
const sc=1+(1-k)*p.size*3.4;p.spr.scale.set(sc,sc,1);
p.mat.opacity=p.op*k*k;}
else if(p.kind==='shard'){
const sc=p.size*(.4+k*.9);p.spr.scale.set(sc,sc,1);
if(p.rot===0&&p.spin)p.rot=Math.random()*6.28;
p.spr.material.rotation=(p.spr.material.rotation||0)+p.spin*dt;
p.mat.opacity=p.op*(k>.7?1:k/.7);}
else{
const sc=p.size*(.5+k*.7);p.spr.scale.set(sc,sc,1);
p.mat.opacity=p.op*Math.min(1,k*1.8);}
}

for(let r=0;r<waveRails.length;r++){const rail=waveRails[r];
for(let i=0;i<rail.length;i++){let w;
if(active&&A.wave)w=A.wave[Math.min(A.wave.length-1,Math.floor(i/N*A.wave.length))];
else w=128+Math.sin(G.time*3+i*.5+r*2.1)*30;
const dev=(w-128)/128;const sp=P.s-10+i*3.6;PATH.pos(sp,PP4);const h=PP4.h;
let lat,baseY,amp;
if(r===0){lat=-7.9;baseY=.5;amp=2.0;}
else if(r===1){lat=7.9;baseY=.5;amp=2.0;}
else{const a2=Math.PI*(i/(N-1));lat=Math.cos(a2)*8.4;baseY=.5+Math.sin(a2)*4.2;amp=1.5;}
const m=rail[i];m.visible=true;
m.position.set(PP4.x+Math.cos(h)*lat,PP4.y+baseY+dev*amp,PP4.z+Math.sin(h)*lat);
m.scale.setScalar(.6+Math.abs(dev)*1.1+A.beatPulse*.35);
const hue=(G.time*.06+i*.014+r*.33)%1;
m.material.color.setHSL(hue,.9,.55+Math.abs(dev)*.25);
m.material.opacity=(active?1:.45)*(.28+Math.abs(dev)*.65);}}
waveGlows.forEach(function(s,idx){const rail=waveRails[idx%3];const m=rail[(Math.floor(idx/3)*9+4)%rail.length];
s.visible=true;s.position.copy(m.position);const sc2=1.1+m.scale.x*1.7;s.scale.set(sc2,sc2,1);
s.material.color.copy(m.material.color);s.material.opacity=m.material.opacity*.7;});}
function updateAudioFX(dt){let bass=0,treb=0;
const active=((A.el&&A.el.src&&!A.el.paused)||(A.elR&&A.elR.src&&!A.elR.paused)||BGM.playing)&&save.musicOn;
if(A.analyser&&active&&A.el&&A.el.src&&!A.el.paused){
A.analyser.getByteFrequencyData(A.freq);
let s=0;for(let i=1;i<=8;i++)s+=A.freq[i];bass=s/8/255;
s=0;for(let i=40;i<100;i++)s+=A.freq[i];treb=s/60/255;}
else if(active){
bass=.2+.16*Math.abs(Math.sin(G.time*BGM_CFG[curTheme].bpm/60*Math.PI))+.05*Math.sin(G.time*1.3);
treb=.15+.1*Math.abs(Math.sin(G.time*.9));}
A.beatAvg+=(bass-A.beatAvg)*Math.min(1,dt*1.6);
if(bass>A.beatAvg*1.32+.02&&bass>.12&&G.time-A.lastBeat>.28){A.lastBeat=G.time;A.beatPulse=1;beatRingT=0;A.beatBurst=true;}
A.beatPulse*=Math.exp(-5*dt);
A.bass+=(bass-A.bass)*Math.min(1,dt*12);A.treb+=(treb-A.treb)*Math.min(1,dt*10);
if(vizMode==='spectrum')updateSpectrum(dt,active);else hideSpectrum();
if(vizMode==='particles')updateVizParticles(dt,active);
else{vizParticles.forEach(function(p){if(p.life>0){p.life=0;p.spr.visible=false;}});streamParts.forEach(function(p){p.spr.visible=false;});}
if(vizMode==='wave')updateWaveRails(dt,active);
else{waveRails.forEach(function(r){r.forEach(function(m){m.visible=false;});});waveGlows.forEach(function(s){s.visible=false;});}
MATS.grid.opacity=THEMES[curTheme].gridOp+A.bass*.28+A.beatPulse*.18;
const ss=60*(1+A.bass*.35+A.beatPulse*.25);sunGlow.scale.set(ss,ss,1);
MATS.crystalGlow.opacity=.55+A.bass*.4;
const ps=1.6*(1+A.bass*.4+A.beatPulse*.2);pSpr.scale.set(ps,ps,1);
pLight.intensity=1.4+A.beatPulse*1.3+A.bass*.6;
MATS.boost.opacity=.7+A.beatPulse*.3;
if(beatRingT<1){beatRingT+=dt*1.5;beatRing.visible=true;
beatRing.position.set(PW.x,PW.y+.06,PW.z);beatRing.rotation.set(-Math.PI/2,-PW.h,0);
const sc=1+beatRingT*16;beatRing.scale.set(sc,sc,1);
MATS.beatRing.opacity=Math.max(0,(1-beatRingT)*.5);
const t2=beatRingT-.22;
if(t2>0&&t2<1){beatRing2.visible=true;beatRing2.position.copy(beatRing.position);beatRing2.rotation.copy(beatRing.rotation);
const sc2=1+t2*22;beatRing2.scale.set(sc2,sc2,1);MATS.beatRing2.opacity=Math.max(0,(1-t2)*.35);}
else beatRing2.visible=false;}
else{beatRing.visible=false;beatRing2.visible=false;}
A.beatBurst=false;}

/* ================= v5.0：疾闪冲刺（Shift / L / 触屏按钮） ================= */
const DASH_CD=4.2,DASH_TIME=.34;
function doDash(dirHint){
if(G.screen!=='hud'||G.phase!=='run')return;
if(G.dashCd>0||G.dashT>0)return;
if(dirHint)P.dashWant=dirHint;
const d=P.dashWant;
/* 已经贴边时朝反方向闪避，保证按钮永远有反馈 */
const eff=(P.lane+d<0||P.lane+d>LANES.length-1)?-d:d;
if(eff===0)return;
G.dashDir=eff;
G.dashCd=DASH_CD;G.dashT=DASH_TIME;
P.slideT=0;
G.invincible=Math.max(G.invincible,DASH_TIME+.14);
sfx('boost');
fxRing(PW.x,PW.y+.9,PW.z,THEMES[curTheme].boost,1.6,.45);
fxBurst(PW.x,PW.y+1,PW.z,0xffffff,12,4.5,.3);

burst(PW.x,PW.y+.8,PW.z,THEMES[curTheme].boost,10,4,.45);}

{kind:'trail',color:THEMES[curTheme].boost,size:rnd(.3,.72),life:.35,vx:0,vy:.4,vz:1.5,drag:2.2,grav:0,opacity:.7});}
